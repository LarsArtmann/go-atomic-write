name: Website

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
      - "CHANGELOG.md"
      - "README.md"
      - "go.mod"
  pull_request:
    branches: [master]
    paths:
      - "website/**"
      - "CHANGELOG.md"
      - "README.md"
      - "go.mod"

permissions:
  contents: read

jobs:
  build:
    name: Build + Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Brand drift check
        run: node ../scripts/generate-brand-assets.mjs --check

      - name: Enable pnpm via corepack
        run: |
          mkdir -p "$HOME/.local/bin"
          corepack enable --install-directory "$HOME/.local/bin"
          corepack prepare pnpm@11.20.0 --activate
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Source + dist gates (hero parity, contrast)
        run: |
          pnpm run check:hero
          pnpm run audit:contrast

      - name: Build-script regression tests
        run: pnpm run test:scripts

      - name: Internal link check
        run: pnpm run check:links

      - name: Validate HTML
        run: pnpm run validate

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-dist
          path: website/dist
          retention-days: 7

  deploy:
    name: Deploy to Firebase
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-dist
          path: website/dist

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          entryPoint: website
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LARS_SOFTWARE }}
          channelId: live
          projectId: lars-software

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable pnpm via corepack
        run: |
          mkdir -p "$HOME/.local/bin"
          corepack enable --install-directory "$HOME/.local/bin"
          corepack prepare pnpm@11.20.0 --activate
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable

      - name: Build
        run: pnpm run build

      - name: Run Lighthouse assertions
        run: pnpm exec lhci autorun --collect.numberOfRuns=1 --upload.target=temporary-public-storage

  smoke:
    name: Playwright smoke suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable pnpm via corepack
        run: |
          mkdir -p "$HOME/.local/bin"
          corepack enable --install-directory "$HOME/.local/bin"
          corepack prepare pnpm@11.20.0 --activate
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm run build

      - name: Run smoke tests
        run: pnpm run test:ui

  preview:
    name: PR preview channel
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-dist
          path: website/dist

      - name: Deploy PR preview to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          entryPoint: website
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LARS_SOFTWARE }}
          channelId: pr-${{ github.event.number }}
          projectId: lars-software
